<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!--
    Browser-tab favicon. Deliberately a SIMPLIFIED version of the full mark
    (two bubbles instead of four/three, no small highlights) because the fine
    detail turns to mush at 16x16. The full version lives in
    src/components/ui/logo-mark.ts -- keep the house/chimney/liquid paths
    below in sync with it if the mark ever changes. This file can't import
    that module because it's served as a static asset.
  -->
  <style>
    .outline { stroke: #16192E; }
    @media (prefers-color-scheme: dark) {
      /* Navy on a dark tab strip would vanish -- flip to near-white. */
      .outline { stroke: #F5F5F7; }
    }
  </style>

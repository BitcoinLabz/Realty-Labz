<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!--
    Browser-tab favicon: the brand tile (2026-09-30) -- the mark in white on a
    navy -> brand-blue gradient, matching the iPhone icon (src/lib/app-icon.tsx).
    The tile reads on light and dark tab strips alike, so no dark-mode swap.

    Deliberately a SIMPLIFIED mark (two bubbles instead of four/three, no small
    highlights) because fine detail turns to mush at 16x16. The mark is drawn
    at 78% inside the tile, like the PNG icons. Keep the house/chimney/liquid
    paths in sync with src/components/ui/logo-mark.ts -- this static file
    can't import that module.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16192E" />
      <stop offset="1" stop-color="#0B6FB8" />
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#tile)" />
  <g transform="translate(11 11) scale(0.78)">
    <path d="M63.6 32 L63.6 25 L70.8 25 L70.8 40" fill="none" stroke="#FFFFFF" stroke-width="5.6" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M24.8 51 C34 45 40.4 57 50 51 C59.6 45 66 55 75.2 49 L75.2 70 Q75.2 77.5 69.2 77.5 L30.8 77.5 Q24.8 77.5 24.8 70 Z" fill="#5BC5F2" />
    <circle cx="38" cy="62" r="4.5" fill="#ffffff" fill-opacity="0.85" />
    <path d="M22.8 48 L50 17 L77.2 48 L77.2 70 Q77.2 80 69.2 80 L30.8 80 Q22.8 80 22.8 70 Z" fill="none" stroke="#FFFFFF" stroke-width="5.6" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="74" cy="9" r="5" fill="#5BC5F2" />
    <circle cx="80.4" cy="18" r="3" fill="#5BC5F2" />
  </g>
</svg>
